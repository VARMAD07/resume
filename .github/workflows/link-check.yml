name: Portfolio link integrity

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "scripts/check_internal_links.py"
      - "scripts/check_public_privacy.py"
      - "scripts/check_portfolio_state.mjs"
      - "data/portfolio-state.json"
      - "scripts/update_iitm_course.mjs"
      - "scripts/check_iitm_curriculum.mjs"
      - "data/iitm-curriculum.json"
      - ".github/workflows/link-check.yml"
  pull_request:
    paths:
      - "index.html"
      - "assets/**"
      - "scripts/check_internal_links.py"
      - "data/portfolio-state.json"
      - "data/iitm-curriculum.json"
      - "scripts/check_portfolio_state.mjs"
      - "scripts/check_iitm_curriculum.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check internal anchors and assets
        run: python scripts/check_internal_links.py
      - name: Check public files for accidental secrets
        run: python scripts/check_public_privacy.py
      - name: Check centralized portfolio state
        run: node scripts/check_portfolio_state.mjs
      - name: Check IITM curriculum and course-state integrity
        run: node scripts/check_iitm_curriculum.mjs
