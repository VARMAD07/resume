name: Portfolio visual QA

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "iitm-learning.js"
      - "data/**"
      - "translations/**"
      - "assets/**"
      - "scripts/visual_qa.mjs"
      - "scripts/check_localization.mjs"
      - ".github/workflows/visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static site
        run: |
          python3 -m http.server 8080 >/tmp/portfolio-http.log 2>&1 &
          sleep 2
      - name: Run rendering and interaction QA
        run: node scripts/visual_qa.mjs
      - name: Check Arabic and Japanese localization
        run: node scripts/check_localization.mjs
      - name: Upload visual QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-qa
          path: visual-qa
          if-no-files-found: error
