name: Portfolio Lighthouse quality gate

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "manifest.webmanifest"
      - "assets/**"
      - "lighthouserc.json"
      - ".github/workflows/lighthouse.yml"
  pull_request:
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "assets/**"
      - "lighthouserc.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
        continue-on-error: true
      - name: Run Lighthouse CI quality gate
        run: npx --yes @lhci/cli@0.14.0 autorun --config=./lighthouserc.json
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lhci-results
          if-no-files-found: ignore
